services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: produtiva
      POSTGRES_PASSWORD: produtiva
      POSTGRES_DB: produtiva
    ports: ["5432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: produtiva
      MINIO_ROOT_PASSWORD: produtiva123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

  # LiveKit (voz, vídeo e compartilhamento de tela do chat interno)
  livekit:
    image: livekit/livekit-server:latest
    command: --dev
    ports: ["7880:7880", "7881:7881"]

volumes:
  pg:
  minio:
