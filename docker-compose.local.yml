# =============================================================================
# Produtiva Gestão no seu computador (Mac, Windows ou Linux com Docker Desktop).
# Modo SANDBOX: nada sai de verdade (Receita, SEFAZ, WhatsApp e e-mail são simulados).
#
#   ./iniciar.sh        (Mac/Linux)   ou   iniciar.bat (Windows)
#
# Painel do escritório: http://localhost:3000   ·   App do cliente: http://localhost:8081
# =============================================================================
x-env: &env
  env_file: .env.local-docker
  environment: &envvars
    INTEGRATIONS_MODE: sandbox
    NODE_ENV: development
    DATABASE_URL: postgresql://produtiva_app:produtiva_app@postgres:5432/produtiva
    SYSTEM_DATABASE_URL: postgresql://produtiva_system:produtiva_system@postgres:5432/produtiva
    MIGRATION_DATABASE_URL: postgresql://produtiva:produtiva@postgres:5432/produtiva
    REDIS_URL: redis://redis:6379
    STORAGE_DRIVER: local
    STORAGE_DIR: /data/storage
    PUBLIC_API_URL: http://localhost:3333
    WEB_ORIGIN: http://localhost:3000,http://localhost:8081
    BROADCAST_DELAY_MS: "500"
    SEED_TENANT_CNPJ: "11444777000161"
    SEED_ADMIN_EMAIL: admin@produtiva.local

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: produtiva, POSTGRES_PASSWORD: produtiva, POSTGRES_DB: produtiva }
    volumes: ["pg:/var/lib/postgresql/data"]
    # sem porta publicada: não briga com outro Postgres instalado no computador
    healthcheck: { test: ["CMD", "pg_isready", "-U", "produtiva"], interval: 3s, retries: 40 }

  redis:
    image: redis:7-alpine
    volumes: ["redis:/data"]

  # 1) Banco: papéis, migrações, RLS e dados iniciais (escritório, departamentos, 83 obrigações)
  setup:
    <<: *env
    build: { context: ., dockerfile: docker/api.Dockerfile, target: build }
    image: produtiva-tools
    working_dir: /repo/packages/db
    command: >
      sh -c "psql \"$$MIGRATION_DATABASE_URL\" -q -f prisma/roles.sql &&
             DATABASE_URL=$$MIGRATION_DATABASE_URL node scripts/migrate-offline.mjs deploy &&
             psql \"$$MIGRATION_DATABASE_URL\" -q -f prisma/rls.sql 2>/dev/null &&
             pnpm seed"
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    <<: *env
    build: { context: ., dockerfile: docker/api.Dockerfile }
    image: produtiva-api
    ports: ["3333:3333"]
    volumes: ["arquivos:/data/storage"]
    depends_on:
      setup: { condition: service_completed_successfully }
      redis: { condition: service_started }
    restart: unless-stopped

  worker:
    <<: *env
    image: produtiva-api
    command: ["node", "dist/worker.js"]
    environment:
      <<: *envvars
      SCHEDULER: "on"
    volumes: ["arquivos:/data/storage"]
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile, args: { NEXT_PUBLIC_API_URL: http://localhost:3333 } }
    image: produtiva-web
    ports: ["3000:3000"]
    restart: unless-stopped

  app-web:
    build: { context: ., dockerfile: docker/mobile-web.Dockerfile, args: { EXPO_PUBLIC_API_URL: http://localhost:3333, EXPO_PUBLIC_OFFICE_CNPJ: "11444777000161" } }
    image: produtiva-app-web
    ports: ["8081:80"]
    restart: unless-stopped

  # Opcional: base de demonstração (6 clientes, Monitor rodado, notas, atendimentos)
  #   docker compose -f docker-compose.local.yml --profile demo run --rm demo
  demo:
    <<: *env
    image: produtiva-tools
    profiles: ["demo"]
    working_dir: /repo/apps/api
    environment:
      <<: *envvars
      API_URL: http://api:3333
    command: ["node", "test/demo.mjs"]
    depends_on: { api: { condition: service_healthy } }
    restart: "no"

volumes:
  pg:
  redis:
  arquivos:
